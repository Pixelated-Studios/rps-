# ci.yml
name: ios build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: set up xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.0.0"

      - name: install xcodegen
        run: brew install xcodegen

      - name: generate xcode project
        run: |
          xcodegen generate

      - name: archive app (unsigned)
        run: |
          xcodebuild \
            -scheme RockPaperScissorsPlus \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath ${{ runner.temp }}/RockPaperScissorsPlus.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean archive

      - name: create ipa structure
        run: |
          APP_PATH="${{ runner.temp }}/RockPaperScissorsPlus.xcarchive/Products/Applications/RockPaperScissorsPlus.app"

          IPA_DIR="${{ runner.temp }}/ipa"
          PAYLOAD_DIR="$IPA_DIR/Payload"

          OUTPUT="${{ runner.temp }}/RockPaperScissorsPlus.ipa"

          mkdir -p "$PAYLOAD_DIR"

          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          cd "$IPA_DIR"

          zip -r "$OUTPUT" Payload

      - name: verify ipa contents
        run: |
          unzip -l "${{ runner.temp }}/RockPaperScissorsPlus.ipa"

      - name: upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockPaperScissorsPlus.ipa
          path: ${{ runner.temp }}/RockPaperScissorsPlus.ipa