// ci.yml
name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v2
        with:
          xcode-version: "15"   # Xcode 15 supports iOS 18
      - name: Build app
        run: |
          xcodebuild -scheme RockPaperScissorsPlus -sdk iphonesimulator -destination "platform=iOS Simulator,name=iPhone 15,OS=latest" clean build
