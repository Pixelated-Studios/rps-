# ci.yml
name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.0.0"   # Xcode 16 supports iOS 18
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: |
          xcodegen generate
      - name: Archive app (unsigned)
        run: |
          xcodebuild \
            -scheme RockPaperScissorsPlus \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath ${{ runner.temp }}/RockPaperScissorsPlus.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            clean archive
      - name: Package .app into .ipa (unsigned)
        run: |
          APP_PATH=${{ runner.temp }}/RockPaperScissorsPlus.xcarchive/Products/Applications/RockPaperScissorsPlus.app
          OUTPUT=${{ runner.temp }}/RockPaperScissorsPlus.ipa
          cd $(dirname "$APP_PATH")
          zip -r "$OUTPUT" "$(basename "$APP_PATH")"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RockPaperScissorsPlus.ipa
          path: ${{ runner.temp }}/RockPaperScissorsPlus.ipa